name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      # Includes the replay of the recorded Python answers (consistency/).
      - run: go test -race ./...
      - run: GOOS=js GOARCH=wasm go build ./...
      - run: GOOS=wasip1 GOARCH=wasm go build ./...

  consistency:
    # Live comparison with the Python stack (see consistency/README.md), on
    # arm64 macOS, where the recordings were made: the reference libraries
    # round differently elsewhere.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .venv && .venv/bin/pip install -r consistency/requirements.txt
      - run: GEOZARR_PYTHON=.venv/bin/python go test ./consistency/ -v 2>&1 | tail -40
        shell: bash
